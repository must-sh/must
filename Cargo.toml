[package]
name = "mustc"
version = "0.1.0"
edition = "2024"
authors = ["Dominik Muc <me@dominikmuc.com>"]
description = "A compiler for the Must programming language."
documentation = "https://docs.rs/mustc"
homepage = "https://github.com/must-sh/must"
repository = "https://github.com/must-sh/must"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = [
    "compiler",
    "programming-language",
    "systems-programming",
    "low-level",
    "aot"
]
categories = [
    "compilers",
    "command-line-utilities",
    "development-tools"
]

include = [
    "src/**/*",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "build.rs",
]

[dependencies]
ariadne = "0.6.0"
clap = { version = "4.6.7", features = ["derive"] }
cranelift-codegen = { version = "0.132.3", features = ["x86"] }
cranelift-frontend = "0.132.3"
cranelift-module = "0.132.3"
cranelift-object = "0.132.3"
ena = "0.14.4"
lalrpop-util = "0.23.2"
salsa = "0.26.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[build-dependencies]
lalrpop = "0.23.2"

[dev-dependencies]
insta = { version = "1.49.0", features = ["glob"] }
